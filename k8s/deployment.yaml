apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-platform
  template:
    metadata:
      labels:
        app: student-platform
    spec:
      containers:
        - name: student-platform
          image: student-platform:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: DATABASE_PATH
              value: "/data/student_management.db"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: app-data
              mountPath: /data
      volumes:
        - name: app-data
          emptyDir: {}
